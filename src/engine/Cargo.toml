[package]
name = "openfo4"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"

[features]
tracy = ["tracing-tracy"]
# Fixtures the integration tests share with the unit tests; enabled for them by the self dev-dependency.
test-support = []

[dependencies]
anyhow = "1.0"
winit = "0.30"
wgpu = "30.0"
pollster = "0.3"
bytemuck = { version = "1.24", features = [ "derive" ] }
image = "0.24"
glam = { version = "0.33", features = ["bytemuck", "serde"] }
rapier3d = { version = "0.35.3", features = ["debug-render", "parallel", "serde-serialize"] }
gltf = { version = "1.4.1", features = ["extras"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
glyphon = "0.12"
spin_sleep = "1.3.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry", "local-time"] }
tracing-tracy = { version = "0.11", optional = true }
egui-notify = "0.23.0"
ddsfile = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sysinfo = "0.39"
rayon = "1.12.0"
crossbeam-channel = "0.5"
mimalloc = { version = "0.1", features = ["v2"] }
thiserror = "2"
naga = { version = "30.0.0", features = ["wgsl-in"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
resvg = { version = "0.48.1", default-features = false, features = ["svgz"] }
tracing-appender = "0.2.5"
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros"] }
kira = { version = "0.12", default-features = false, features = ["cpal", "flac"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Settings and toggle structs are plain data; bitflags/enums would be a refactor.
struct_excessive_bools = "allow"
# Render and GPU-pass entry points take explicit resource lists.
too_many_arguments = "allow"
# !(x > y) deliberately treats NaN as failing the check.
neg_cmp_op_on_partial_ord = "allow"

[dev-dependencies]
openfo4 = { path = ".", features = ["test-support"] }
proptest = "1.12.0"
tempfile = "3.27.0"
